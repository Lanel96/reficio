name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Windows x64
        run: |
          dotnet publish Reficio.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/windows-x64
          dotnet publish ReficioUpdater/ReficioUpdater.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o publish/updater
          Copy-Item publish/updater/ReficioUpdater.exe publish/windows-x64/ReficioUpdater.exe

      - name: Package ZIP
        shell: powershell
        run: |
          $files = Get-ChildItem "publish/windows-x64" -File | Where-Object { $_.Extension -ne ".pdb" }
          Compress-Archive -Path $files.FullName -DestinationPath "publish/Reficio-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reficio-windows
          path: publish/Reficio-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish macOS ARM64
        run: |
          dotnet publish Reficio.csproj -c Release -r osx-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/osx-arm64
          dotnet publish ReficioUpdater/ReficioUpdater.csproj -c Release -r osx-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/updater
          cp publish/updater/ReficioUpdater publish/osx-arm64/ReficioUpdater

      - name: Package ZIP
        run: |
          cd publish/osx-arm64
          zip -r ../Reficio-macos-arm64.zip . -x "*.pdb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reficio-macos
          path: publish/Reficio-macos-arm64.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: dist/Reficio-*.zip