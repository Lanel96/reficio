image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - build
  - package

variables:
  PACKAGE: reficio

# Compila en cada push para validar el código; en tags genera el binario de Windows.
build-windows:
  stage: build
  script:
    - dotnet publish Reficio.csproj -c Release -r win-x64
      --self-contained true
      -p:PublishSingleFile=true
      -p:IncludeNativeLibrariesForSelfExtract=true
      -o publish/windows-x64
  artifacts:
    paths:
      - publish/
    expire_in: 1 week

# Solo en tags: empaqueta el ZIP y lo publica en el registro de paquetes de GitLab
# (ruta reficio/{version}/Reficio-windows-x64.zip) que usa la app para actualizarse.
package:
  stage: package
  needs:
    - build-windows
  script:
    - apt-get update -qq && apt-get install -y -qq zip
    - VERSION="${CI_COMMIT_TAG#v}"
    - cd publish
    - zip -r "Reficio-windows-x64.zip" "windows-x64/" -x "*.pdb"
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "Reficio-windows-x64.zip" \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE/$VERSION/Reficio-windows-x64.zip"
  artifacts:
    paths:
      - publish/Reficio-windows-x64.zip
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
